<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Sabor Gourmet - Gestión de Clientes</title>
    <th:block th:replace="fragments/header :: head"></th:block>
</head>
<body>

<div th:replace="fragments/header :: navbar"></div>

<div class="container mt-5">
    <h1 class="page-title"><i class="fas fa-users me-2"></i> Gestión de Clientes</h1>

    <div class="d-flex justify-content-between mb-4">
        <a th:href="@{/clientes/nuevo}" class="btn btn-success">
            <i class="fas fa-plus-circle me-1"></i> Nuevo Cliente
        </a>
        <a th:href="@{/bitacora}" class="btn btn-secondary">
            <i class="fas fa-book-open me-1"></i> Ver Bitácora
        </a>
    </div>

    <table class="table table-hover table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>DNI</th>
            <th>Nombres y Apellidos</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.idCliente}">1</td>
            <td th:text="${cliente.dni}">12345678</td>
            <td th:text="${cliente.nombres} + ' ' + ${cliente.apellidos}">Juan Pérez</td>
            <td th:text="${cliente.telefono}">987654321</td>
            <td th:text="${cliente.correo}">correo@ejemplo.com</td>
            <td>
                <span th:classappend="${cliente.estado == 'ACTIVO' ? 'badge bg-success' : 'badge bg-warning'}" th:text="${cliente.estado}">Activo</span>
            </td>
            <td class="text-center">
                <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}" class="btn btn-sm btn-warning me-2">
                    <i class="fas fa-edit"></i> Editar
                </a>
                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Está seguro de eliminar a este cliente? Esta acción es irreversible.');">
                    <i class="fas fa-trash-alt"></i> Eliminar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${#lists.isEmpty(clientes)}" class="alert alert-info text-center mt-4">
        No se encontraron clientes registrados en el sistema.
    </div>
</div>

<th:block th:replace="fragments/header :: scripts"></th:block>
</body>
</html>
