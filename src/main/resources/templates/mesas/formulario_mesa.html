<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion} + ' Mesa'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 th:text="${accion} + ' Mesa'" class="mb-4"></h2>

    <form th:action="@{/mesas/guardar}" th:object="${mesa}" method="post">
        <input type="hidden" th:field="*{idMesa}">

        <div class="mb-3">
            <label for="numero" class="form-label">Número de Mesa</label>
            <input type="number" class="form-control" id="numero" th:field="*{numero}" required>
        </div>
        <div class="mb-3">
            <label for="capacidad" class="form-label">Capacidad</label>
            <input type="number" class="form-control" id="capacidad" th:field="*{capacidad}" required>
        </div>

        <div class="mb-3">
            <label for="estado" class="form-label">Estado</label>
            <select class="form-select" id="estado" th:field="*{estado}" required>
                <option th:each="estadoMesa : ${T(com.medina.eva03.model.EstadoMesa).values()}"
                        th:value="${estadoMesa}"
                        th:text="${#strings.capitalize(#strings.toLowerCase(estadoMesa.name()))}">
                    [Estado]
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}">Error de estado</div>
        </div>
        <button type="submit" class="btn btn-success" th:text="${accion}"></button>
        <a th:href="@{/mesas}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
