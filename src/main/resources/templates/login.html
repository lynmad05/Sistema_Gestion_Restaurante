<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sabor Gourmet - Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background-color: #f0f8f8; /* Color de fondo ligero para Minty */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Ocupa toda la altura de la ventana */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evita scrolls inesperados */
        }
        .login-card {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); /* Sombra más pronunciada */
            width: 90%; /* Ancho responsivo */
            max-width: 900px; /* Ancho máximo para pantallas grandes */
            display: flex; /* Para controlar el layout interno con flexbox */
            overflow: hidden; /* Asegura que las esquinas redondeadas se apliquen a todo */
        }
        .login-form-container {
            padding: 40px;
            flex: 1; /* Ocupa el espacio disponible */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-image-container {
            flex: 1; /* Ocupa el espacio disponible */
            background-color: #e0f2f1; /* Un color de fondo suave para la imagen */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .login-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cubre el contenedor sin distorsionarse */
            border-top-right-radius: 15px; /* Redondea las esquinas de la imagen */
            border-bottom-right-radius: 15px;
            display: block;
        }
        .login-header {
            color: #278036; /* Color primario de Minty */
            font-weight: 700;
            margin-bottom: 10px;
        }
        .login-subtitle {
            color: #6c757d; /* Texto secundario */
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #278036;
            border-color: #278036;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #1f642a; /* Tono más oscuro al pasar el mouse */
            border-color: #1f642a;
        }
        .text-demo {
            font-size: 0.9em;
            color: #8c8c8c;
            margin-top: 25px;
        }
        /* Media Queries para responsividad */
        @media (max-width: 768px) {
            .login-card {
                flex-direction: column; /* Apila las columnas en pantallas pequeñas */
                max-width: 500px;
            }
            .login-image-container {
                height: 200px; /* Altura fija para la imagen en móviles */
                border-radius: 15px 15px 0 0; /* Redondea solo las esquinas superiores */
            }
            .login-image {
                border-top-right-radius: 15px;
                border-bottom-left-radius: 0; /* Asegura que no se redondee abajo a la izquierda */
            }
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-form-container">
        <h3 class="login-header">Bienvenido a Sabor Gourmet</h3>
        <p class="login-subtitle">Inicie sesión para continuar</p>

        <div th:if="${param.error}" class="alert alert-dismissible alert-danger fade show" role="alert">
            <strong>Error:</strong> Usuario o contraseña inválidos.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${param.logout}" class="alert alert-dismissible alert-success fade show" role="alert">
            Sesión cerrada exitosamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label for="username" class="form-label visually-hidden">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label visually-hidden">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">
                <i class="fas fa-sign-in-alt me-2"></i> Acceder
            </button>
        </form>

        <p class="text-center text-demo">Credenciales Demo: <strong>admin</strong> / <strong>123</strong></p>
    </div>

    <div class="login-image-container d-none d-md-flex"> <img src="https://i.pinimg.com/originals/bc/94/25/bc942528cb9c7d0532058852d531d5ce.jpg"
                                                              alt="Restaurante Sabor Gourmet" class="login-image">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
