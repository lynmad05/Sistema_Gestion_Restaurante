<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- Fragmento HEAD: Carga el CSS, meta tags y estilos personalizados -->
    <th:block th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <!-- Carga el tema Minty de Bootswatch -->
        <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/minty/bootstrap.min.css" rel="stylesheet">
        <!-- Carga Font Awesome para iconos -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
            body {
                background-color: #f8f9fa; /* Fondo claro */
            }

            .page-title {
                color: #278036;
                font-weight: 700;
                margin-bottom: 30px;
            }

            /* ✅ Verde oscuro personalizado para la barra de navegación */
            .navbar-custom {
                background-color: #278036 !important;
            }

            /* Opcional: hover más oscuro en enlaces del navbar */
            .navbar-custom .nav-link:hover {
                color: #d4f5d0 !important;
            }

            /* Ajuste del toggler (botón hamburguesa en móvil) */
            .navbar-toggler {
                border-color: rgba(255, 255, 255, 0.4);
            }

            .navbar-toggler-icon {
                filter: brightness(0) invert(1); /* Hace el ícono blanco */
            }
        </style>
    </th:block>
</head>
<body>

<!-- Fragmento NAV: La barra de navegación principal -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">🍽️ Sabor Gourmet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Menú principal -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes}" sec:authorize="hasRole('ADMIN')">
                        <i class="fas fa-users me-1"></i> Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/mesas}" sec:authorize="hasRole('ADMIN')">
                        <i class="fas fa-utensils me-1"></i> Mesas
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/bitacora}" sec:authorize="hasRole('ADMIN')">
                        <i class="fas fa-book-open me-1"></i> Bitácora
                    </a>
                </li>
            </ul>

            <!-- Información del usuario y botón de Salir -->
            <ul class="navbar-nav">
                <li class="nav-item d-flex align-items-center me-3">
                    <span class="nav-link text-white-50 p-0">
                        <i class="fas fa-user-circle me-1"></i> Logeado como:
                        <span sec:authentication="name" class="fw-bold text-white"></span>
                    </span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="fas fa-sign-out-alt me-1"></i> Salir
                        </button>
                    </form>
                </li>
            </ul>

        </div>
    </div>
</nav>

<!-- Fragmento SCRIPTS: Carga el JavaScript de Bootstrap -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
